id: org.gnome.Mahjongg
runtime: org.gnome.Platform
sdk: org.gnome.Sdk
runtime-version: '49'
command: gnome-mahjongg

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

cleanup:
  - /share/man

modules:
  - name: gnome-mahjongg
    buildsystem: meson
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gnome-mahjongg/49/gnome-mahjongg-49.1.tar.xz
        sha256: 4c8aa6d45ec767266f14852f5b0ad401c0fbf9aa76231abfcc6cb57a6739d069
        x-checker-data:
          type: gnome
          name: gnome-mahjongg
