id: org.gnome.Mahjongg
runtime: org.gnome.Platform
sdk: org.gnome.Sdk
runtime-version: '51'
command: gnome-mahjongg

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

cleanup:
  - /share/man

modules:
  - name: gnome-mahjongg
    buildsystem: meson
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gnome-mahjongg/51/gnome-mahjongg-51.1.tar.xz
        sha256: 2ef9a1cd246d8ccc9ccd27fa435f972a81def9cf3eccc4c880cbb8929ffb8821
        x-checker-data:
          type: gnome
          name: gnome-mahjongg
