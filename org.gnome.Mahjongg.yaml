    buildsystem: meson
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gnome-mahjongg/51/gnome-mahjongg-51.0.tar.xz
        sha256: 8389a824af7b5eae92d6c9c62ea9fde1527f880c10fe51246d38beec31b8c288
        x-checker-data:
          type: gnome
          name: gnome-mahjongg
